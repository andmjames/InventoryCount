<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pallet Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f4;
      --bg-tertiary: #efede8;
      --text: #1a1a18;
      --text-secondary: #6b6b67;
      --text-tertiary: #a0a09c;
      --border: rgba(0,0,0,0.12);
      --border-md: rgba(0,0,0,0.22);
      --radius-md: 8px;
      --radius-lg: 12px;
      --success-bg: #eaf3de;
      --success-text: #3b6d11;
      --info-bg: #e6f1fb;
      --info-text: #185fa5;
      --danger-bg: #fcebeb;
      --danger-text: #a32d2d;
      --danger-border: rgba(163,45,45,0.3);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg-secondary: #252523;
        --bg-tertiary: #2e2e2b;
        --text: #f0ede6;
        --text-secondary: #a0a09c;
        --text-tertiary: #6b6b67;
        --border: rgba(255,255,255,0.1);
        --border-md: rgba(255,255,255,0.2);
        --success-bg: #173404;
        --success-text: #c0dd97;
        --info-bg: #042c53;
        --info-text: #b5d4f4;
        --danger-bg: #501313;
        --danger-text: #f7c1c1;
        --danger-border: rgba(247,193,193,0.25);
      }
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-tertiary);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .app {
      background: var(--bg);
      border-radius: 16px;
      border: 0.5px solid var(--border);
      padding: 1.75rem;
      width: 100%;
      max-width: 740px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 0.5px solid var(--border);
    }
    .header-icon {
      width: 38px;
      height: 38px;
      background: var(--text);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-icon i { color: var(--bg); font-size: 20px; }
    .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    .header p { font-size: 13px; color: var(--text-secondary); font-family: 'DM Mono', monospace; margin-top: 2px; }

    .scan-section {
      background: var(--bg-secondary);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: block;
    }
    .scan-row { display: flex; gap: 8px; }

    input, button, select {
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
    }
    .input {
      flex: 1;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      padding: 10px 12px;
      border: 1.5px solid var(--border-md);
      border-radius: var(--radius-md);
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .input:focus { border-color: var(--text); }
    .hint { font-size: 12px; color: var(--text-tertiary); margin-top: 8px; font-family: 'DM Mono', monospace; }

    .btn {
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 0.5px solid var(--border-md);
      background: var(--bg);
      color: var(--text);
      transition: opacity 0.12s, background 0.12s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--bg-secondary); }
    .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
    .btn-primary:hover { opacity: 0.82; background: var(--text); }
    .btn-danger { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-border); }
    .btn-danger:hover { opacity: 0.85; }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 1rem;
    }
    .stat {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 10px 14px;
    }
    .stat .slabel { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.07em; }
    .stat .sval { font-size: 22px; font-weight: 500; font-family: 'DM Mono', monospace; margin-top: 2px; }

    .toolbar { display: flex; gap: 8px; margin-bottom: 0.75rem; align-items: center; flex-wrap: wrap; }
    .search-input {
      flex: 1;
      min-width: 160px;
      font-size: 13px;
      padding: 8px 10px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    .search-input:focus { border-color: var(--border-md); }

    .table-wrap {
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
    thead { background: var(--bg-secondary); }
    th {
      padding: 8px 12px;
      text-align: left;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { color: var(--text); }
    td {
      padding: 9px 12px;
      border-top: 0.5px solid var(--border);
      font-family: 'DM Mono', monospace;
      vertical-align: middle;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tr:hover td { background: var(--bg-secondary); }
    .td-num { text-align: right; }
    .td-actions { font-family: 'DM Sans', sans-serif; text-align: right; }
    .action-btn {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      border: 0.5px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      margin-left: 4px;
    }
    .action-btn:hover { background: var(--bg-secondary); color: var(--text); }
    .empty { text-align: center; padding: 2.5rem; color: var(--text-secondary); font-family: 'DM Sans', sans-serif; font-size: 14px; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      width: 100%;
      max-width: 380px;
      border: 0.5px solid var(--border);
    }
    .modal-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 1rem;
    }
    .badge-new { background: var(--success-bg); color: var(--success-text); }
    .badge-existing { background: var(--info-bg); color: var(--info-text); }
    .modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .modal-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 1rem 0; }
    .meta-item { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 8px 10px; }
    .meta-item .mlabel { font-size: 11px; color: var(--text-secondary); letter-spacing: 0.06em; text-transform: uppercase; }
    .meta-item .mval { font-size: 14px; font-weight: 500; font-family: 'DM Mono', monospace; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qty-row { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem; }
    .qty-input { width: 110px; font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; text-align: center; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--text);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 200;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 520px) {
      body { padding: 0; }
      .app { border-radius: 0; border: none; padding: 1.25rem; min-height: 100vh; }
      .stats-bar { grid-template-columns: repeat(3, 1fr); }
      .stat .sval { font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-icon"><i class="ti ti-scan" aria-hidden="true"></i></div>
    <div>
      <h1>Pallet Inventory</h1>
      <p>scan or type a barcode to log a pallet</p>
    </div>
  </div>

  <div class="scan-section">
    <span class="label">Barcode</span>
    <div class="scan-row">
      <input class="input" id="barcodeInput" placeholder="e.g. ITEM001-50-PAL2024" autocomplete="off" />
      <button class="btn btn-primary" onclick="handleScan()">
        <i class="ti ti-scan" aria-hidden="true"></i>Scan
      </button>
    </div>
    <div class="hint">Format: ITEMNUM-QTY-PALLETID &nbsp;|&nbsp; Press Enter to scan</div>
  </div>

  <div class="stats-bar">
    <div class="stat"><div class="slabel">Pallets</div><div class="sval" id="statPallets">0</div></div>
    <div class="stat"><div class="slabel">SKUs</div><div class="sval" id="statSKUs">0</div></div>
    <div class="stat"><div class="slabel">Total Units</div><div class="sval" id="statUnits">0</div></div>
  </div>

  <div class="toolbar">
    <input class="search-input" id="searchInput" placeholder="Search pallets or items..." oninput="renderTable()" />
    <button class="btn" onclick="exportCSV()"><i class="ti ti-download" aria-hidden="true"></i>Export CSV</button>
    <button class="btn btn-danger" id="clearBtn" onclick="clearAll()" style="display:none">
      <i class="ti ti-trash" aria-hidden="true"></i>Clear All
    </button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('palletId')">Pallet ID <i class="ti ti-selector" style="font-size:11px" aria-hidden="true"></i></th>
          <th onclick="sortBy('itemNum')">Item # <i class="ti ti-selector" style="font-size:11px" aria-hidden="true"></i></th>
          <th onclick="sortBy('qty')" style="text-align:right">Qty <i class="ti ti-selector" style="font-size:11px" aria-hidden="true"></i></th>
          <th>Barcode</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-badge" id="modalBadge"></div>
    <h2 id="modalTitle"></h2>
    <div class="modal-meta" id="modalMeta"></div>
    <span class="label" id="qtyLabel">Set quantity</span>
    <div class="qty-row">
      <input class="input qty-input" type="number" id="qtyInput" min="0" placeholder="0" />
      <span style="font-size:13px;color:var(--text-secondary)">units</span>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveQty()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let inventory = {};
  let sortKey = 'palletId';
  let sortAsc = true;
  let currentParsed = null;

  try { inventory = JSON.parse(localStorage.getItem('palletInventory') || '{}'); } catch(e) {}

  function saveData() {
    try { localStorage.setItem('palletInventory', JSON.stringify(inventory)); } catch(e) {}
  }

  function parseBarcode(raw) {
    const s = raw.trim();
    if (!s) return null;
    const parts = s.split('-');
    if (parts.length < 3) return null;
    const itemNum = parts[0];
    const qty = parseInt(parts[1], 10);
    const palletId = parts.slice(2).join('-');
    if (!itemNum || isNaN(qty) || qty < 0 || !palletId) return null;
    return { itemNum, qty, palletId, raw: s };
  }

  function handleScan() {
    const raw = document.getElementById('barcodeInput').value;
    const parsed = parseBarcode(raw);
    if (!parsed) { showToast('Invalid barcode. Use format: ITEMNUM-QTY-PALLETID'); return; }
    currentParsed = parsed;
    const existing = inventory[parsed.palletId];
    const isNew = !existing;

    const badge = document.getElementById('modalBadge');
    badge.className = 'modal-badge ' + (isNew ? 'badge-new' : 'badge-existing');
    badge.innerHTML = isNew
      ? '<i class="ti ti-plus" aria-hidden="true"></i> New pallet'
      : '<i class="ti ti-edit" aria-hidden="true"></i> Existing pallet';

    document.getElementById('modalTitle').textContent = isNew ? 'Register new pallet' : 'Update pallet quantity';
    document.getElementById('qtyLabel').textContent = isNew
      ? 'Quantity on pallet'
      : 'Update quantity (current: ' + existing.qty.toLocaleString() + ' units)';

    const qtyInput = document.getElementById('qtyInput');
    qtyInput.value = isNew ? parsed.qty : existing.qty;

    document.getElementById('modalMeta').innerHTML = `
      <div class="meta-item"><div class="mlabel">Pallet ID</div><div class="mval" title="${esc(parsed.palletId)}">${esc(parsed.palletId)}</div></div>
      <div class="meta-item"><div class="mlabel">Item #</div><div class="mval">${esc(parsed.itemNum)}</div></div>
      <div class="meta-item"><div class="mlabel">Barcode qty</div><div class="mval">${parsed.qty}</div></div>
      <div class="meta-item"><div class="mlabel">Status</div><div class="mval">${isNew ? 'New' : 'On file'}</div></div>
    `;

    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => qtyInput.focus(), 60);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('barcodeInput').value = '';
    document.getElementById('barcodeInput').focus();
  }

  function saveQty() {
    if (!currentParsed) return;
    const qty = parseInt(document.getElementById('qtyInput').value, 10);
    if (isNaN(qty) || qty < 0) { showToast('Please enter a valid quantity'); return; }
    const isNew = !inventory[currentParsed.palletId];
    inventory[currentParsed.palletId] = {
      palletId: currentParsed.palletId,
      itemNum: currentParsed.itemNum,
      qty,
      barcode: currentParsed.raw
    };
    saveData();
    renderAll();
    closeModal();
    showToast(isNew ? 'Pallet registered — ' + qty.toLocaleString() + ' units' : 'Quantity updated — ' + qty.toLocaleString() + ' units');
  }

  function deletePallet(id) {
    if (!confirm('Delete pallet ' + id + '? This cannot be undone.')) return;
    delete inventory[id];
    saveData();
    renderAll();
    showToast('Pallet removed');
  }

  function editPallet(id) {
    const r = inventory[id];
    if (!r) return;
    document.getElementById('barcodeInput').value = r.barcode || (r.itemNum + '-' + r.qty + '-' + r.palletId);
    handleScan();
  }

  function sortBy(key) {
    if (sortKey === key) sortAsc = !sortAsc;
    else { sortKey = key; sortAsc = true; }
    renderTable();
  }

  function renderTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    let rows = Object.values(inventory).filter(r =>
      r.palletId.toLowerCase().includes(q) ||
      r.itemNum.toLowerCase().includes(q) ||
      (r.barcode || '').toLowerCase().includes(q)
    );
    rows.sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'qty') { av = Number(av); bv = Number(bv); }
      else { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
      if (av < bv) return sortAsc ? -1 : 1;
      if (av > bv) return sortAsc ? 1 : -1;
      return 0;
    });
    const body = document.getElementById('tableBody');
    if (!rows.length) {
      const msg = Object.keys(inventory).length
        ? 'No results match your search'
        : 'No pallets yet — scan a barcode to get started';
      body.innerHTML = '<tr><td colspan="5" class="empty">' + msg + '</td></tr>';
      return;
    }
    body.innerHTML = rows.map(r => `
      <tr>
        <td title="${esc(r.palletId)}">${esc(r.palletId)}</td>
        <td>${esc(r.itemNum)}</td>
        <td class="td-num">${r.qty.toLocaleString()}</td>
        <td style="font-size:11px;color:var(--text-tertiary)" title="${esc(r.barcode||'')}">${esc(r.barcode || '')}</td>
        <td class="td-actions">
          <button class="action-btn" onclick="editPallet('${esc(r.palletId)}')" title="Edit"><i class="ti ti-edit" aria-hidden="true"></i></button>
          <button class="action-btn" onclick="deletePallet('${esc(r.palletId)}')" title="Delete"><i class="ti ti-trash" aria-hidden="true"></i></button>
        </td>
      </tr>
    `).join('');
  }

  function renderStats() {
    const pallets = Object.values(inventory);
    document.getElementById('statPallets').textContent = pallets.length;
    document.getElementById('statSKUs').textContent = new Set(pallets.map(p => p.itemNum)).size;
    document.getElementById('statUnits').textContent = pallets.reduce((s, p) => s + p.qty, 0).toLocaleString();
    document.getElementById('clearBtn').style.display = pallets.length ? '' : 'none';
  }

  function renderAll() { renderStats(); renderTable(); }

  function exportCSV() {
    const pallets = Object.values(inventory);
    if (!pallets.length) { showToast('No inventory to export'); return; }
    const totals = {};
    const counts = {};
    pallets.forEach(r => {
      totals[r.itemNum] = (totals[r.itemNum] || 0) + r.qty;
      counts[r.itemNum] = (counts[r.itemNum] || 0) + 1;
    });
    const rows = [['Item Number', 'Total Quantity On Hand', 'Pallet Count']];
    Object.keys(totals).sort().forEach(item => {
      rows.push([item, totals[item], counts[item]]);
    });
    const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'inventory_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('CSV exported — ' + Object.keys(totals).length + ' SKUs');
  }

  function clearAll() {
    if (!confirm('Clear ALL pallet records? This cannot be undone.')) return;
    inventory = {};
    saveData();
    renderAll();
    showToast('Inventory cleared');
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  document.getElementById('barcodeInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleScan(); });
  document.getElementById('qtyInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveQty(); });
  document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

  renderAll();
</script>
</body>
</html>
